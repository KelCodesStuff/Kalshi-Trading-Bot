services:
  db:
    image: postgres:16-alpine
    container_name: kalshi-bot-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-kalshi_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kalshi_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    image: ghcr.io/kelcodesstuff/kalshi-trading-bot:latest
    container_name: kalshi-bot
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - KALSHI_PRIVATE_KEY_PATH=/app/kalshi_private_key_demo.pem
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-kalshi_bot}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
    # Mount the local private keys from the host directly into the container's working directory
    volumes:
      - ./kalshi_private_key_demo.pem:/app/kalshi_private_key_demo.pem:ro
      # Uncomment the line below when you are ready to trade with real fiat money
      # - ./kalshi_private_key_prod.pem:/app/kalshi_private_key_prod.pem:ro
    # The application logs gracefully to stdout, which Docker captures.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
